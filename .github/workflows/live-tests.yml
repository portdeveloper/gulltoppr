name: Live contract tests

on:
  workflow_dispatch:
    inputs:
      live_engine_base_url:
        description: "Optional deployed engine base URL to smoke instead of the checked-out server"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: live-contract-tests
  cancel-in-progress: false

jobs:
  # Audits run as their own job: a newly published advisory says nothing about
  # whether the contract ladder still works, and when it gated the live job it
  # failed the whole run daily while `test:live` never even executed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: sdk
      - run: npm run audit
      - run: npm run audit:sdk

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: sdk
      - run: npm run verify -- --skip-audit
      - run: npm run test:live
        env:
          # Default to the deployed engine: heimdall-api is Flycast-private, so a
          # checkout-local engine has no rung 4 and those tests skip. Prod reaches
          # heimdall over the private network, restoring real decompile coverage.
          # A workflow_dispatch input still overrides for smoking other deploys.
          LIVE_ENGINE_BASE_URL: ${{ inputs.live_engine_base_url || 'https://api.gulltoppr.dev' }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          HEIMDALL_API_URL: ${{ vars.HEIMDALL_API_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          BNB_RPC_URL: ${{ secrets.BNB_RPC_URL }}
          VICTION_RPC_URL: ${{ secrets.VICTION_RPC_URL }}
