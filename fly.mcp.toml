# Fly config for the gulltoppr MCP server (Streamable HTTP). Same codebase as the
# engine, deployed separately so agents can connect at /mcp over HTTP.
app = "gulltoppr-mcp"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.mcp"

[env]
  PORT = "8080"
  # Thin client: all resolution happens in the engine (its cache + Etherscan key).
  ENGINE_URL = "https://api.gulltoppr.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Machine check (flyd), not a service check (Fly proxy) — see fly.toml for why.
[checks]
  [checks.health]
    type = "http"
    port = 8080
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
