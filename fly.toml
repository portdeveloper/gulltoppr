# Fly config for the abi.ninja engine. Co-located in cdg with gulltoppr
# (heimdall-api) to minimize ladder rung-4 latency.
app = "abi-ninja-engine"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  GULLTOPPR_URL = "https://heimdall-api.fly.dev"
  ABININJA_BASE_URL = "https://abi.ninja"
  # Persistent result cache: SQLite (node:sqlite) on the mounted volume.
  NODE_OPTIONS = "--experimental-sqlite"
  CACHE_DB_PATH = "/data/cache.db"

[[mounts]]
  source = "abi_cache"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
