# Fly config for the gulltoppr engine. Co-located in cdg with heimdall-api
# (heimdall-api) to minimize ladder rung-4 latency.
app = "gulltoppr"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  # heimdall-api has no public IPs (2026-07-27): it is an internal backend of this
  # engine, and leaving it on the open internet meant scanner traffic woke it within
  # ~10s of every autostop, so it billed as always-on. Reached over Flycast, which
  # still autostarts it on demand. Plain http:// — Flycast does not terminate TLS.
  HEIMDALL_API_URL = "http://heimdall-api.flycast"
  SIGNING_BASE_URL = "https://abi.ninja"
  # Persistent result cache: SQLite (node:sqlite) on the mounted volume.
  NODE_OPTIONS = "--experimental-sqlite"
  CACHE_DB_PATH = "/data/cache.db"

[[mounts]]
  source = "gulltoppr_cache"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# A top-level [checks] block, not [[http_service.checks]]: service checks are run
# by the Fly proxy, so on a scale-to-zero app they report "the machine hasn't
# started" against a sleeping Machine. Machine checks are run by flyd on the host
# and only while the Machine is up, which is what we want here.
[checks]
  [checks.health]
    type = "http"
    port = 8080
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
